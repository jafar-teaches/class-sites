  --a31:#ff9d63; --a31-bg:#3a2416; --a32:#5fd1bf; --a32-bg:#15302c; --a41:#a7a4ff; --a41-bg:#24233f; --a42:#e29be0; --a42-bg:#3a2238; --a43:#d9c48a; --a43-bg:#2f2a1a;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:grid;gap:28px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-family:var(--display);font-size:clamp(28px,5vw,38px);line-height:1.05;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--display);font-size:21px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
p{margin:0;max-width:68ch}
section{display:grid;gap:12px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.em{font-style:normal;flex:none;width:1.4em;text-align:center;line-height:1}

.demobar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;background:var(--tint);border:1px dashed var(--faint);border-radius:10px;padding:8px 12px;font-size:13.5px;color:var(--muted)}
.demobar nav{display:flex;flex-wrap:wrap;gap:6px}
.demobar a{font-weight:600;text-decoration:none;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.demobar a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.net{background:var(--net-bg);color:var(--net)} .pill.ms{background:var(--ms-bg);color:var(--ms)} .pill.you{background:var(--you-bg);color:var(--you)}
.pill.sac{background:var(--sac-bg);color:var(--sac)} .pill.exam{background:var(--exam-bg);color:var(--exam)}
.pill.a31{background:var(--a31-bg);color:var(--a31)} .pill.a32{background:var(--a32-bg);color:var(--a32)} .pill.a41{background:var(--a41-bg);color:var(--a41)} .pill.a42{background:var(--a42-bg);color:var(--a42)} .pill.a43{background:var(--a43-bg);color:var(--a43)}
.btn{appearance:none;font:inherit;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 11px;cursor:pointer;text-decoration:none}
.btn.ms{border-color:var(--ms);color:var(--ms)}
.btn.lnk{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.path{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-word}

.toast{position:absolute;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:min(560px,calc(100% - 32px));z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2)}
footer{font-size:13px;color:var(--muted);display:grid;gap:4px}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s}}

.pill.c1{background:var(--c1-bg);color:var(--c1)} .pill.c2{background:var(--c2-bg);color:var(--c2)} .pill.c3{background:var(--c3-bg);color:var(--c3)} .pill.c4{background:var(--c4-bg);color:var(--c4)} .pill.c5{background:var(--c5-bg);color:var(--c5)} .pill.c6{background:var(--c6-bg);color:var(--c6)}
.pill.test{background:var(--sac-bg);color:var(--sac)}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{position:relative}

html[data-theme="light"]{--bg:#ffffff}
html[data-theme="light"] .wrap{max-width:1240px;padding-block:8px 32px}


.today{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ink);border-radius:12px;padding:16px 18px;display:grid;gap:8px}
.today .lab{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.today .big{font-family:var(--display);font-size:clamp(20px,4vw,25px);line-height:1.2;display:flex;gap:8px;align-items:baseline}
.today .item+.item{border-top:1px solid var(--line);padding-top:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list{list-style:none;margin:0;padding:0;display:grid;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.list li{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .when{font-variant-numeric:tabular-nums;font-size:13.5px}
.list .when small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.list .what{display:flex;gap:8px;align-items:baseline;min-width:0}
.list .what .code{font-family:var(--mono);font-size:12.5px;color:var(--muted);flex:none}
.list li.sac,.list li.test{background:var(--sac-bg)} .list li.sac .what,.list li.test .what{color:var(--sac);font-weight:600}
.list li.exam{background:var(--exam-bg)} .list li.exam .what{color:var(--exam);font-weight:600}
.list li.off{color:var(--muted);font-style:italic}
.empty{color:var(--muted);font-style:italic;padding:12px 14px}
.aosdot{width:9px;height:9px;border-radius:50%;flex:none;align-self:center}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.date{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sac);border-radius:10px;padding:10px 12px;display:grid;gap:3px;text-decoration:none;color:inherit}
.date.check{border-left-color:var(--faint)} .date.exam{border-left-color:var(--exam)} .date.past{opacity:.55}
.date .d{font-family:var(--display);font-size:18px}
.date .t{font-weight:600}
.date .c{font-size:13px;color:var(--muted)}
.date .more{font-size:13px;color:var(--accent)}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.unit{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c6);border-radius:10px;padding:10px 12px;display:grid;gap:4px;align-content:start;text-decoration:none;color:var(--ink)}
.unit span{font-size:13px;color:var(--muted)}
.unit.soon{opacity:.6}
a.unit:hover b,.unit-main:hover b{text-decoration:underline}
.unit-main{display:grid;gap:4px;text-decoration:none;color:var(--ink)}
.unit-sub{font-size:13px;font-weight:600;text-decoration:none;color:var(--accent);margin-top:2px}
.unit-sub:hover{text-decoration:underline}

.hero{border-radius:14px;padding:18px 20px;display:grid;gap:8px}
.hero .q{font-family:var(--display);font-size:clamp(18px,3vw,21px);line-height:1.25;margin:0}
.hero .stmt{font-size:14px;opacity:.85}
.back{font-size:14px;text-decoration:none;font-weight:600;width:fit-content}
.stage{display:grid;gap:8px}
.stage h2 small{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}
.lesson{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c6);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start}
.lesson.p,.lesson.d{border-left-width:6px}
.lesson.sac,.lesson.test{border-left-color:var(--sac)!important;background:var(--sac-bg)}
.lesson.exam{border-left-color:var(--exam)!important;background:var(--exam-bg)}
.lesson .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lesson .code{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.lesson .ttl{font-weight:600}
a.tlink{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
a.tlink:hover{text-decoration-color:currentColor}
.lesson .wk{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.lesson details{grid-column:1/-1;font-size:13.5px}
.lesson summary{cursor:pointer;color:var(--muted);width:fit-content}
.lesson ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;max-width:70ch}
.lesson .note{grid-column:1/-1;font-size:13px;color:var(--muted)}
.types{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted)}
.ck{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px 12px;scroll-margin-top:16px}
.ck h3{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:14px 0 6px}
.ck ol{list-style:none;margin:0;padding:0;display:grid}
.ck>ol>li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ck>ol>li:last-child{border-bottom:0}
.ck input{width:18px;height:18px;margin-top:2px}
.ck .by{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ck .by span{font-family:var(--mono);font-size:11.5px;background:var(--tint);border-radius:4px;padding:1px 6px;color:var(--muted)}
.ck .by span.gap{background:var(--sac-bg);color:var(--sac);font-family:var(--body);font-weight:600}
.ck ul{margin:4px 0 0;padding-left:18px;list-style:disc}
.ck ul li{padding:2px 0;font-size:13.5px}
.ck li.done>div{color:var(--muted)}
.prog{font-size:14px;color:var(--muted)}
.prog b{color:var(--ink);font-variant-numeric:tabular-nums}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-top b{font-family:var(--display);font-size:18px}
.cal-top button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.cal-top button:disabled{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.cal-dow{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:center;padding:2px 0}
.cal-d{min-height:64px;border:1px solid var(--line);border-radius:8px;padding:4px 5px;display:flex;flex-direction:column;gap:2px;background:var(--bg);font:inherit;color:inherit;text-align:left;cursor:pointer;min-width:0}
.cal-d.blank{visibility:hidden}
.cal-d.none{cursor:default;opacity:.55}
.cal-d.past{opacity:.6}
.cal-d.today{outline:2px solid var(--ink);outline-offset:-1px}
.cal-d.sel{box-shadow:0 0 0 2px var(--accent) inset}
.cal-d.off{background:var(--tint)}
.cal-d.sac,.cal-d.test{background:var(--sac-bg)} .cal-d.exam{background:var(--exam-bg)}
.cal-n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cal-i{font-size:12px;line-height:1.25;border-left:3px solid var(--c6);padding-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-i.off{border-left-color:var(--faint);font-style:italic;color:var(--muted)}
.cal-day{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.cal-day .lab{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.calbtn{font-size:14px;font-weight:600;text-decoration:none;color:var(--accent);width:fit-content}
@media (max-width:600px){.cal-d{min-height:48px;padding:3px}.cal-i .tx{display:none}.cal-i{font-size:13px;border-left-width:2px}}
sub,sup{line-height:0}
.view{display:grid;gap:28px}
@media (max-width:600px){.list li{grid-template-columns:1fr}.list .when{grid-column:1/-1}.btns{justify-content:flex-start}.lesson{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
