<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
:root{--bg:#eef3f1;--surface:#fff;--ink:#1c2b3a;--muted:#51616f;--line:#cfdad6}
@media (prefers-color-scheme:dark){:root{--bg:#141d24;--surface:#1c2832;--ink:#e4ecf0;--muted:#9fb0bc;--line:#2d3d49;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px}
h1{font:800 2.2rem/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px}
p{color:var(--muted);margin:0 0 18px}
a.l{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:12px;color:var(--ink);text-decoration:none}
a.l b{display:block;font-size:1.2rem}
a.l span{color:var(--muted);font-size:1rem}
a.l:hover,a.l:focus-visible{border-color:var(--ink)}
:focus-visible{outline:3px solid #d99a00;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>My lessons</h1>
  <p>Heat transfer. Open the lesson your teacher tells you.</p>
  <a class="l" href="lesson-1.html"><b>Lesson 1: Heat transfer</b><span>Conduction, convection and radiation</span></a>
</div>
</body>
</html>
